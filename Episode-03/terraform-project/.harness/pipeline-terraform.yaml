pipeline:
  name: terraform-infra-pipeline
  identifier: terraform_infra_pipeline
  projectIdentifier: HarnessCICDZerotoHero
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: org.gitconnector
        repoName: Harness-CI-CD-Zero-to-Hero
        build: <+input>
  variables:
    - name: tf_action
      type: String
      description: "Choose: apply or destroy"
      value: <+input>.allowedValues(apply,destroy)
    - name: aws_region
      type: String
      description: AWS region
      value: us-east-1
    - name: s3_bucket_name
      type: String
      description: S3 bucket holding Terraform state
      required: true
      value: terraform-harness-delegates
    - name: instance_type
      type: String
      description: EC2 instance type (must be Free Tier eligible for the account)
      required: true
      value: t3.micro
  stages:
    - stage:
        name: terraform
        identifier: terraform
        description: "Apply or Destroy AWS infrastructure"
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Terraform Init
                  identifier: tf_init
                  spec:
                    shell: Sh
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("account.aws_access_key_id")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("account.aws_secret_access_key")>
                      AWS_DEFAULT_REGION: <+pipeline.variables.aws_region>
                      TF_STATE_BUCKET: <+pipeline.variables.s3_bucket_name>
                      TF_INSTANCE_TYPE: <+pipeline.variables.instance_type>
                    command: |-
                      echo "=== Terraform Init ==="
                      if [ -z "$(echo "$TF_STATE_BUCKET" | tr -d '[:space:]')" ]; then
                        echo "ERROR: pipeline variable s3_bucket_name is empty. Provide the S3 bucket that stores Terraform state."
                        exit 1
                      fi
                      # Strip stray whitespace/newlines from credentials
                      AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
                      AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
                      TF_STATE_BUCKET="$(printf '%s' "$TF_STATE_BUCKET" | tr -d '[:space:]')"
                      if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
                        echo "ERROR: AWS credentials are empty. Check secrets aws_access_key_id and aws_secret_access_key."
                        exit 1
                      fi
                      export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
                      unset TF_LOG TF_LOG_CORE TF_LOG_PROVIDER
                      cd Episode-03/terraform-project
                      # t2.micro is not Free Tier eligible on this account: override the instance type in main.tf
                      sed -i -E "s/(instance_type[[:space:]]*=[[:space:]]*)\"t2\.micro\"/\1\"$TF_INSTANCE_TYPE\"/" main.tf
                      grep -n "instance_type" main.tf || true
                      terraform init \
                        -backend-config="bucket=$TF_STATE_BUCKET" \
                        -backend-config="key=harness-demo/terraform.tfstate" \
                        -backend-config="region=<+pipeline.variables.aws_region>"
                      echo "=== Init Done! ==="
              - step:
                  type: Run
                  name: Terraform Plan
                  identifier: tf_plan
                  spec:
                    shell: Sh
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("account.aws_access_key_id")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("account.aws_secret_access_key")>
                      AWS_DEFAULT_REGION: <+pipeline.variables.aws_region>
                    command: |-
                      echo "=== Terraform Plan (action: <+pipeline.variables.tf_action>) ==="
                      cd Episode-03/terraform-project
                      if [ "<+pipeline.variables.tf_action>" = "destroy" ]; then
                        terraform plan -destroy -no-color
                      else
                        terraform plan -no-color
                      fi
                      echo "=== Plan Done! ==="
              - step:
                  type: Run
                  name: Terraform Execute
                  identifier: tf_execute
                  spec:
                    shell: Sh
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("account.aws_access_key_id")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("account.aws_secret_access_key")>
                      AWS_DEFAULT_REGION: <+pipeline.variables.aws_region>
                    command: |-
                      echo "=== Terraform <+pipeline.variables.tf_action> ==="
                      cd Episode-03/terraform-project
                      if [ "<+pipeline.variables.tf_action>" = "destroy" ]; then
                        terraform destroy -auto-approve -no-color
                        echo ""
                        echo "========================================="
                        echo "  DESTROYED! All resources deleted."
                        echo "  AWS bill for these resources: \$0"
                        echo "========================================="
                      else
                        terraform apply -auto-approve -no-color
                        echo ""
                        echo "========================================="
                        echo "  CREATED!"
                        terraform output
                        echo "========================================="
                      fi
